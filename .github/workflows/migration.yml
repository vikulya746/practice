name: Idempotent Mattermost Migration

on:
  push:
    branches: [ "migration" ]
  workflow_dispatch:

env:
  COMPOSE_FILE: docker-compose.prod.yml
  FLAG_FILE: D:\gh-runner-practice\.mattermost_migration_completed

jobs:
  migrate-and-deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check Migration Status
        id: check_status
        shell: cmd
        run: |
          if exist "%FLAG_FILE%" (
            echo already_migrated=true>> %GITHUB_OUTPUT%
          ) else (
            echo already_migrated=false>> %GITHUB_OUTPUT%
          )

      - name: Backup Legacy MySQL (Real Dump)
        if: steps.check_status.outputs.already_migrated == 'false'
        shell: cmd
        run: |
          docker ps | findstr "mattermost-mysql" >nul
          if errorlevel 1 (
            echo Error: Legacy MySQL container is not running!
            exit /b 1
          )
          :: Делаем дамп базы внутрь папки проекта (том будет доступен позже)
          docker exec mattermost-mysql mysqldump -u root -p${{ secrets.DB_MYSQL_ROOT_PASSWORD }} --single-transaction --routines --triggers mattermost > mattermost_mysql_dump.sql
          echo Backup created successfully.

      - name: Start Target PostgreSQL
        if: steps.check_status.outputs.already_migrated == 'false'
        shell: cmd
        run: |
          :: Удаляем старую базу, если она висит
          docker rm -f mattermost-postgres >nul 2>&1
          docker rm -f pgloader >nul 2>&1
          
          :: Поднимаем пустую PostgreSQL в нужной сети
          docker run -d --name mattermost-postgres --network legacy_mattermost_network -e POSTGRES_USER=mmuser -e POSTGRES_PASSWORD=${{ secrets.DB_POSTGRES_PASSWORD }} -e POSTGRES_DB=mattermost postgres:15-alpine
          
          :: Ждем инициализации (15 секунд)
          ping -n 16 127.0.0.1 >nul

      - name: Run pgloader (Using Official Mattermost Container)
        if: steps.check_status.outputs.already_migrated == 'false'
        shell: cmd
        run: |
          :: Запускаем официальный контейнер pgloader, монтируя туда наш дамп
          docker run --rm --network legacy_mattermost_network -v %cd%\mattermost_mysql_dump.sql:/tmp/dump.sql mattermost/mattermost-pgloader:latest pgloader --with "include drop" --with "create tables" --with "create indexes" --with "reset sequences" --with "foreign keys" --with "downcase identifiers" mysql://root:${{ secrets.DB_MYSQL_ROOT_PASSWORD }}@mattermost-mysql/mattermost postgresql://mmuser:${{ secrets.DB_POSTGRES_PASSWORD }}@mattermost-postgres/mattermost
          if errorlevel 1 (
            echo "pgloader failed, but we will try to proceed to see if data is there"
          )

      - name: Mark Migration as Completed
        if: steps.check_status.outputs.already_migrated == 'false'
        shell: cmd
        run: type nul > "%FLAG_FILE%"

      - name: Deploy Upgraded Stack
        shell: cmd
        run: |
          :: Запускаем новый Mattermost. --remove-orphans удалит старый контейнер с MySQL
          docker compose -f %COMPOSE_FILE% up -d --remove-orphans
          :: Ждем, пока Mattermost применит свои внутренние миграции (30 секунд)
          ping -n 31 127.0.0.1 >nul

      - name: Run Health Checks
        shell: cmd
        run: |
          curl -f http://localhost:8065/api/v4/system/ping
          if errorlevel 1 (
            docker compose -f %COMPOSE_FILE% logs
            exit /b 1
          )
          echo Mattermost successfully upgraded and running on Postgres!
      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mattermost-migration-logs-${{ github.run_attempt }}  # 
          path: |
            mattermost_mysql_dump.sql
            *.txt